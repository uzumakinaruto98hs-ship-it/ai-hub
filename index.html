<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f7f9ff;
    color:#111827;
    min-height:100vh;
    overflow:hidden;
}

/* TOP BAR */
header{
    height:105px;
    background:white;
    border-bottom:1px solid #e8ecf4;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 4%;
}

.brand h2{
    font-size:32px;
    color:#14213d;
}

.brand h2 span{
    color:#2467d8;
}

.brand p{
    margin-top:5px;
    color:#6b7280;
    font-size:15px;
}

/* THEME BUTTON */
.theme{
    width:88px;
    height:48px;

    border:1px solid #dfe4ed;
    border-radius:30px;

    background:white;

    font-size:20px;
    cursor:pointer;
}

/* MAIN */
.hero{
    height:calc(100vh - 105px);

    display:flex;
    flex-direction:column;
    align-items:center;

    padding-top:26vh;

    background:
    radial-gradient(
        circle at 50% 45%,
        #ffffff 0%,
        #f5f7ff 60%,
        #f0f4ff 100%
    );
}

/* BADGE */
.badge{
    padding:11px 22px;

    border-radius:30px;

    background:#edf4ff;
    color:#1764d4;

    font-size:17px;
    font-weight:bold;

    margin-bottom:28px;
}

/* TITLE */
.hero h1{
    font-size:60px;
    font-weight:700;

    margin-bottom:20px;
}

.hero h1 span{
    color:#1767dc;
}

.hero p{
    color:#667085;
    font-size:20px;
}

/* CHAT AREA */
.chat-area{
    position:fixed;

    left:50%;
    bottom:42px;

    transform:translateX(-50%);

    width:92%;
    max-width:900px;
}

/* CHAT BAR */
.chat-box{
    width:100%;
    height:72px;

    background:white;

    border:1px solid #e1e6ef;

    border-radius:40px;

    padding:9px;

    display:flex;
    align-items:center;

    box-shadow:
        0 12px 35px rgba(35,65,120,.15);
}

/* PLUS */
.plus{
    width:54px;
    height:54px;

    border:none;
    border-radius:50%;

    background:#edf1f7;

    color:#667085;

    font-size:32px;

    cursor:pointer;
}

.plus:hover{
    background:#e1e7f0;
}

/* INPUT */
.chat-input{
    flex:1;

    height:100%;

    border:none;
    outline:none;

    background:transparent;

    padding:0 20px;

    font-size:18px;
    color:#172033;
}

.chat-input::placeholder{
    color:#8a93a3;
}

/* SEND */
.send{
    width:54px;
    height:54px;

    border:none;
    border-radius:50%;

    background:#1767dc;

    color:white;

    font-size:25px;

    cursor:pointer;
}

.send:hover{
    background:#0e56bd;
}

/* TOOLS POPUP */
.tools-menu{
    display:none;

    position:absolute;

    left:0;
    bottom:85px;

    width:330px;

    padding:10px;

    background:#202124;

    border-radius:22px;

    box-shadow:
        0 18px 45px rgba(0,0,0,.28);

    z-index:10;
}

.tools-menu.show{
    display:block;
}

/* TOOL */
.menu-item{
    display:flex;
    align-items:center;

    gap:14px;

    padding:11px;

    border-radius:15px;

    color:white;

    cursor:pointer;
}

.menu-item:hover{
    background:#303136;
}

.menu-icon{
    width:45px;
    height:45px;

    border-radius:50%;

    background:#36383d;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:21px;
}

.menu-text{
    font-size:16px;
}

/* MOBILE */
@media(max-width:700px){

    header{
        height:105px;
        padding:0 5%;
    }

    .brand h2{
        font-size:27px;
    }

    .brand p{
        font-size:13px;
    }

    .theme{
        width:75px;
        height:43px;
    }

    .hero{
        padding-top:26vh;
    }

    .badge{
        font-size:14px;
        padding:10px 17px;
    }

    .hero h1{
        font-size:42px;
    }

    .hero p{
        font-size:16px;
        text-align:center;
        padding:0 20px;
    }

    .chat-area{
        width:94%;
        bottom:30px;
    }

    .chat-box{
        height:68px;
    }

    .plus,
    .send{
        width:50px;
        height:50px;
    }

    .chat-input{
        font-size:16px;
        padding:0 10px;
    }

    .tools-menu{
        width:290px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>

    <div class="brand">

        <h2>
            AI <span>Hub</span>
        </h2>

        <p>
            Made with ❤️ by Hema Sai Challa
        </p>

    </div>

    <button class="theme" onclick="toggleTheme()">
        ☼ ☾
    </button>

</header>


<!-- MAIN -->
<section class="hero">

    <div class="badge">
        ✦ Smart AI Tools for Everyone
    </div>

    <h1>
        Welcome to <span>AI</span>
    </h1>

    <p>
        Ask anything, create anything and learn anything with AI.
    </p>

</section>


<!-- CHAT -->
<div class="chat-area">

    <!-- PLUS MENU -->

    <div class="tools-menu" id="toolsMenu">

        <div class="menu-item"
             onclick="selectTool('AI Text Generator')">

            <div class="menu-icon">🔤</div>

            <div class="menu-text">
                AI Text Generator
            </div>

        </div>


        <div class="menu-item"
             onclick="selectTool('Prompt Generator')">

            <div class="menu-icon">🪄</div>

            <div class="menu-text">
                Prompt Generator
            </div>

        </div>


        <div class="menu-item"
             onclick="selectTool('Study Helper')">

            <div class="menu-icon">🎓</div>

            <div class="menu-text">
                Study Helper
            </div>

        </div>


        <div class="menu-item"
             onclick="selectTool('Image Generator')">

            <div class="menu-icon">🖼️</div>

            <div class="menu-text">
                Image Generator
            </div>

        </div>


        <div class="menu-item"
             onclick="selectTool('Summarizer')">

            <div class="menu-icon">📝</div>

            <div class="menu-text">
                Summarizer
            </div>

        </div>


        <div class="menu-item"
             onclick="selectTool('Idea Generator')">

            <div class="menu-icon">💡</div>

            <div class="menu-text">
                Idea Generator
            </div>

        </div>

    </div>


    <!-- TEXT BAR -->

    <div class="chat-box">

        <button class="plus" onclick="toggleMenu()">
            +
        </button>

        <input
            id="aiInput"
            class="chat-input"
            type="text"
            placeholder="Ask AI anything..."
        >

        <button class="send" onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>


<script>

/* PLUS MENU */

function toggleMenu(){

    const menu =
        document.getElementById("toolsMenu");

    menu.classList.toggle("show");
}


/* SELECT TOOL */

function selectTool(tool){

    const input =
        document.getElementById("aiInput");

    input.value = tool + ": ";

    input.focus();

    document
        .getElementById("toolsMenu")
        .classList.remove("show");
}


/* SEND */

function sendMessage(){

    const input =
        document.getElementById("aiInput");

    const text =
        input.value.trim();

    if(text === ""){
        return;
    }

    alert(
        "You asked:\n\n" +
        text +
        "\n\nAI feature will be connected next 🚀"
    );
}


/* THEME */

function toggleTheme(){

    document.body.classList.toggle("dark");

}


/* ENTER KEY */

document
    .getElementById("aiInput")
    .addEventListener("keydown", function(e){

        if(e.key === "Enter"){
            sendMessage();
        }

    });

</script>

</body>
</html>
