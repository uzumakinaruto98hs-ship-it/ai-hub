<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Hub</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f7f9fc;
    color:#172033;
    min-height:100vh;
}

header{
    height:82px;
    background:white;
    border-bottom:1px solid #e5eaf2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
}

.logo{
    font-size:27px;
    font-weight:bold;
}

.logo span{
    color:#2866d8;
}

.sub{
    color:#737d8e;
    font-size:13px;
    margin-top:4px;
}

.theme{
    border:1px solid #dce3ee;
    background:white;
    border-radius:25px;
    padding:10px 15px;
    font-size:18px;
    cursor:pointer;
}

.chat-page{
    height:calc(100vh - 82px);
    display:flex;
    flex-direction:column;
}

.welcome{
    text-align:center;
    padding-top:85px;
}

.welcome.hide{
    display:none;
}

.badge{
    display:inline-block;
    padding:9px 18px;
    border-radius:25px;
    background:#edf4ff;
    color:#2866d8;
    font-weight:bold;
    margin-bottom:20px;
}

.welcome h1{
    font-size:52px;
    margin-bottom:12px;
}

.welcome h1 span{
    color:#2866d8;
}

.welcome p{
    color:#707b8c;
    font-size:18px;
}

.messages{
    flex:1;
    width:100%;
    max-width:850px;
    margin:35px auto 0;
    padding:0 20px 150px;
    overflow-y:auto;
}

.message{
    display:flex;
    margin:14px 0;
}

.message.user{
    justify-content:flex-end;
}

.bubble{
    max-width:75%;
    padding:13px 17px;
    border-radius:18px;
    font-size:16px;
    line-height:1.5;
    word-wrap:break-word;
    white-space:pre-wrap;
}

.user .bubble{
    background:#2866d8;
    color:white;
    border-bottom-right-radius:5px;
}

.ai .bubble{
    background:white;
    border:1px solid #e2e7ef;
    color:#273247;
    border-bottom-left-radius:5px;
}

.input-area{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    width:92%;
    max-width:850px;
}

.tools-menu{
    display:none;
    position:absolute;
    left:0;
    bottom:82px;
    width:320px;
    padding:10px;
    background:#202124;
    border-radius:20px;
    box-shadow:0 18px 45px rgba(0,0,0,.28);
    z-index:20;
}

.tools-menu.show{
    display:block;
}

.menu-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:11px;
    border-radius:14px;
    color:white;
    cursor:pointer;
}

.menu-item:hover{
    background:#303136;
}

.menu-icon{
    width:44px;
    height:44px;
    border-radius:12px;
    background:#35373c;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.menu-text{
    font-size:15px;
}

.input-box{
    height:68px;
    background:white;
    border:1px solid #dce3ee;
    border-radius:36px;
    padding:8px;
    display:flex;
    align-items:center;
    box-shadow:0 10px 35px rgba(40,70,120,.15);
}

.plus{
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    background:#eef2f7;
    font-size:29px;
    color:#566274;
    cursor:pointer;
}

.input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    padding:0 17px;
    font-size:17px;
}

.send{
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    background:#2866d8;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.send:disabled{
    opacity:.6;
}

@media(max-width:700px){

    header{
        height:75px;
        padding:0 5%;
    }

    .logo{
        font-size:23px;
    }

    .sub{
        font-size:11px;
    }

    .theme{
        padding:8px 12px;
    }

    .chat-page{
        height:calc(100vh - 75px);
    }

    .welcome{
        padding-top:65px;
    }

    .welcome h1{
        font-size:40px;
    }

    .welcome p{
        font-size:15px;
        padding:0 20px;
    }

    .messages{
        padding-left:14px;
        padding-right:14px;
    }

    .bubble{
        max-width:82%;
    }

    .input-area{
        width:94%;
        bottom:18px;
    }

    .tools-menu{
        width:290px;
    }
}
</style>
</head>

<body>

<header>

    <div>
        <div class="logo">
            🤖 AI <span>Hub</span>
        </div>

        <div class="sub">
            Made with ❤️ by Hema Sai Challa
        </div>
    </div>

    <button class="theme" onclick="toggleTheme()">
        ☼ ☾
    </button>

</header>

<section class="chat-page">

    <div class="welcome" id="welcome">

        <div class="badge">
            ✦ Smart AI Tools for Everyone
        </div>

        <h1>
            Welcome to <span>AI</span>
        </h1>

        <p>
            Ask anything, create anything and learn anything with AI.
        </p>

    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">

        <div class="tools-menu" id="toolsMenu">

            <div class="menu-item"
                 onclick="selectTool('AI Text Generator')">
                <div class="menu-icon">🔤</div>
                <div class="menu-text">AI Text Generator</div>
            </div>

            <div class="menu-item"
                 onclick="selectTool('Prompt Generator')">
                <div class="menu-icon">🪄</div>
                <div class="menu-text">Prompt Generator</div>
            </div>

            <div class="menu-item"
                 onclick="selectTool('Study Helper')">
                <div class="menu-icon">🎓</div>
                <div class="menu-text">Study Helper</div>
            </div>

            <div class="menu-item"
                 onclick="selectTool('Image Generator')">
                <div class="menu-icon">🖼️</div>
                <div class="menu-text">Image Generator</div>
            </div>

            <div class="menu-item"
                 onclick="selectTool('Summarizer')">
                <div class="menu-icon">📝</div>
                <div class="menu-text">Summarizer</div>
            </div>

            <div class="menu-item"
                 onclick="selectTool('Idea Generator')">
                <div class="menu-icon">💡</div>
                <div class="menu-text">Idea Generator</div>
            </div>

        </div>

        <div class="input-box">

            <button class="plus" onclick="toggleMenu()">
                +
            </button>

            <input
                id="input"
                class="input"
                type="text"
                placeholder="Ask AI anything..."
                autocomplete="off"
            >

            <button class="send" id="sendBtn" onclick="sendMessage()">
                ➤
            </button>

        </div>

    </div>

</section>

<script>

/* YOUR CLOUDFLARE WORKER URL */
const AI_API_URL =
"https://ai-hub-apii.uzumakinaruto98hs.workers.dev/";


function toggleMenu(){

    document
        .getElementById("toolsMenu")
        .classList.toggle("show");

}


function selectTool(tool){

    const input =
        document.getElementById("input");

    input.value = tool + ": ";

    input.focus();

    document
        .getElementById("toolsMenu")
        .classList.remove("show");

}


async function sendMessage(){

    const input =
        document.getElementById("input");

    const sendBtn =
        document.getElementById("sendBtn");

    const text =
        input.value.trim();

    if(text === ""){
        return;
    }

    document
        .getElementById("welcome")
        .classList.add("hide");

    addMessage(text,"user");

    input.value = "";

    sendBtn.disabled = true;

    addMessage("Thinking...","ai");

    const messages =
        document.getElementById("messages");

    const thinkingBubble =
        messages.lastElementChild
        .querySelector(".bubble");

    try{

        const response =
            await fetch(AI_API_URL,{
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    message:text
                })
            });


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error || "AI request failed"
            );

        }


        if(data.reply){

            thinkingBubble.textContent =
                data.reply;

        }else{

            thinkingBubble.textContent =
                "AI nundi reply raledu ❌";

        }

    }catch(error){

        console.error(error);

        thinkingBubble.textContent =
            "AI connection ki problem vachindhi ❌";

    }

    sendBtn.disabled = false;

    messages.scrollTop =
        messages.scrollHeight;

}


function addMessage(text,type){

    const messages =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;

    message.appendChild(bubble);

    messages.appendChild(message);

    messages.scrollTop =
        messages.scrollHeight;

}


function toggleTheme(){

    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){

        document.body.style.background =
            "#111827";

        document.body.style.color =
            "#f1f5f9";

    }else{

        document.body.style.background =
            "#f7f9fc";

        document.body.style.color =
            "#172033";

    }

}


document
    .getElementById("input")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                event.preventDefault();

                sendMessage();

            }

        }
    );


document.addEventListener(
    "click",
    function(event){

        const menu =
            document.getElementById("toolsMenu");

        const plus =
            document.querySelector(".plus");

        if(
            !menu.contains(event.target) &&
            !plus.contains(event.target)
        ){

            menu.classList.remove("show");

        }

    }
);

</script>

</body>
    </html>
